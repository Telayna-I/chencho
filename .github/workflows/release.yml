name: Release

# Tags publish; pull requests that touch what ships only build, so a broken build shows up before tagging.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "agent/**"
      - "npm/**"
      - "shared/**"
      - "overlay/**"
      - "scripts/release.ts"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  # npm's Trusted Publishing: each package trusts this workflow, so publishing needs no token.
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Test
        run: |
          (cd agent && bun install --frozen-lockfile)
          bun test agent npm
          dotnet test overlay

      - name: Build
        run: |
          if [ "$PUBLISH" = true ]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.0-ci; fi
          bun scripts/release.ts --version "$version"

      - name: Publish to npm
        if: env.PUBLISH == 'true'
        run: |
          # The binaries first, so the launcher never points at a version that doesn't exist yet.
          for package in chencho-win32-x64 chencho; do
            npm publish --access public "dist/npm/$package"
          done

      - name: GitHub release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/npm/chencho-win32-x64/bin -DestinationPath dist/chencho-win32-x64.zip
          gh release create $env:GITHUB_REF_NAME dist/chencho-win32-x64.zip --generate-notes
